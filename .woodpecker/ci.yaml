# Woodpecker counterpart of .github/workflows/ci.yml: formatting and
# dependency checks on every push to main-v2 and on every pull request.

when:
  - event: push
    branch: main-v2
  - event: pull_request

# The pinned cargo-deny download is an x86_64 build.
labels:
  platform: linux/amd64

variables:
  - &rust_image docker.io/library/rust:1.97-bookworm
  - &cargo_deny_version 0.20.2

steps:
  # Formatting does not depend on the platform, so it runs once.
  - name: fmt
    image: *rust_image
    commands:
      - rustup component add rustfmt
      - cargo fmt --all --check

  # Reads Cargo metadata only — nothing is compiled.
  - name: deny
    image: *rust_image
    environment:
      CARGO_DENY_VERSION: *cargo_deny_version
    commands:
      - curl -fsSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/$${CARGO_DENY_VERSION}/cargo-deny-$${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz --strip-components=1 -C /usr/local/bin
      - cargo deny check licenses advisories bans sources
