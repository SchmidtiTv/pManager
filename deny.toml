[licenses]
version = 2
confidence-threshold = 0.9

private = { ignore = true }

allow = [
    "Apache-2.0",
    "MIT",
    "MIT-0",       # MIT without the attribution clause (borrow-or-share, via jsonschema)
    "MPL-2.0",     # file-level copyleft (option-ext); only binds if we modify that crate
    "Unicode-3.0", # unicode-ident, alongside MIT/Apache-2.0
    "Zlib",        # foldhash
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
