[package]
name = "pmanager"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "pManager command line interface"
repository = "https://github.com/SchmidtiTv/pManager"
readme = "README.md"
publish = false

[[bin]]
name = "pmanager"
path = "src/main.rs"

[lib]
name = "pmanager"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive", "env", "wrap_help"] }
directories = "6.0.0"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sevenz-rust2 = { version = "0.21", default-features = false, features = ["compress", "util"] }
thiserror = "2.0.19"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
