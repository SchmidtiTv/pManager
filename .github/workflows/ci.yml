name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Windows is the only platform vManager targets, so it is the only platform
  # anything is compiled or run on. This job replaces the old per-OS build
  # matrix: it already compiles the whole crate and runs the test suite, which
  # is strictly more than a `cargo build` smoke test was checking.
  check:
    name: Format, lint and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Smoke test the release binary
        run: cargo run --release -- --version

  # Reads Cargo metadata only — it never builds or runs vManager, so the
  # runner OS is irrelevant and the cheapest one is fine.
  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources
